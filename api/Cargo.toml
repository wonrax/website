[package]
name = "api"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.1", features = ["full"] }
retainer = "0.5.0"
dotenv = "0.15.0"
futures-util = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# rig no longer forces these; prompts and tool schemas keep their key order
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
rand = "0.10.4"
# mimalloc v3 is the default since 0.1.49, so no feature flag is needed.
mimalloc = "0.1.52"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }
backtrace = "0.3.77"
thiserror = "2.0.21"
ipnetwork = "0.21.1"
rspotify = "0.16.1"
diesel = { version = "2.4.0", features = ["postgres", "serde_json", "chrono"] }
diesel-async = { version = "0.10.0", features = ["deadpool", "postgres"] }
eyre = "0.6.14"
serenity = "0.12.5"
const_format = "0.2.37"
futures = "0.3.34"
article_scraper = "3.0.2"
url = "2.5.8"
rig = { package = "rig-core", version = "0.46.0", features = ["reqwest"] }
rig-reqwest = "0.46.0"
rig-agent = "0.46.0"
uuid = { version = "1.29.3", features = ["v4"] }
arc-swap = "1.9.5"
scc = "3.9.0"
async-trait = "0.1.92"
html-to-markdown-rs = "3.22.2"
robotxt = "0.7.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
deadpool-runtime = { version = "0.3.1", features = ["tokio_1"] }
bytes = "1.12.2"
bollard = "0.21.1"
tar = "0.4.46"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
criterion = "0.8.2"
# Scripted models for the agent run tests
rig-agent = { version = "0.46.0", features = ["test-utils"] }

[[bench]]
name = "blog_comments"
harness = false
